name: Windows build

# Builds Utter for Windows on GitHub's Windows machines, for x64 and ARM64:
#
#   utter.exe            the app (a GUI program, so no console window opens)
#   utter.com            its console entry point, so `utter` works in a terminal
#   UtterSetup-<arch>.exe the per-user installer around both
#
# Every push to main builds them, tests the installer (install, reinstall,
# uninstall), and keeps the files as the run's artifacts. Pushing a tag
# v<version>, matching Cargo.toml's version, also publishes them as a GitHub
# Release, which packaging/release/install-windows.ps1 installs from.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    # ARM64 PCs are few; a failing ARM64 build doesn't hold back the x64 release.
    continue-on-error: ${{ matrix.label == 'arm64' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            label: x64
            runner: windows-latest
          - arch: aarch64
            label: arm64
            runner: windows-11-arm
    env:
      # Portable CPU kernels: without this, ggml tunes to the build machine's
      # CPU and the app can crash on older PCs.
      TRANSCRIBE_CMAKE_ARGS: -DGGML_NATIVE=OFF
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Read the version
        id: version
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME doesn't match Cargo.toml's version $version; tag v$version instead."
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Output "Building Utter $version for ${{ matrix.label }}."

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: '1.97'

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ matrix.arch }}

      # x64 decodes speech on the GPU through Vulkan; ARM64 stays on the CPU.
      - name: Install the Vulkan SDK
        if: matrix.arch == 'x86_64'
        uses: humbletim/install-vulkan-sdk@30ba978f977e81b72d091fc8888feb1fb26f9aff # v1.2
        with:
          version: 1.4.309.0
          cache: true

      - name: Install SPIRV-Headers for the Vulkan backend
        if: matrix.arch == 'x86_64'
        shell: pwsh
        run: |
          vcpkg install spirv-headers:x64-windows
          if ($LASTEXITCODE -ne 0) { throw "vcpkg install spirv-headers failed" }
          $prefix = "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows" -replace '\\','/'
          $combined = if ($env:CMAKE_PREFIX_PATH) { "$prefix;$env:CMAKE_PREFIX_PATH" } else { $prefix }
          Add-Content $env:GITHUB_ENV "CMAKE_PREFIX_PATH=$combined"

      # ggml's ARM CPU backend refuses MSVC, so the speech engine builds with
      # clang-cl through Ninja there, with ggml's own threadpool instead of OpenMP.
      - name: Use clang-cl for ARM64
        if: matrix.arch == 'aarch64'
        shell: pwsh
        run: |
          @(
            'CC=clang-cl', 'CXX=clang-cl',
            'CMAKE_C_COMPILER=clang-cl', 'CMAKE_CXX_COMPILER=clang-cl',
            'CMAKE_C_COMPILER_TARGET=aarch64-pc-windows-msvc', 'CMAKE_CXX_COMPILER_TARGET=aarch64-pc-windows-msvc',
            'CMAKE_GENERATOR=Ninja', 'CL=/EHsc',
            'TRANSCRIBE_CMAKE_ARGS=-DGGML_NATIVE=OFF -DGGML_OPENMP=OFF'
          ) | Out-File -FilePath $env:GITHUB_ENV -Append

      # One cargo run builds both programs in parallel, with the dist profile:
      # the release build plus whole-program link-time optimization.
      - name: Build utter.exe and utter.com
        shell: pwsh
        run: |
          $started = Get-Date
          cargo build --locked --profile dist -p utter -p utter-console
          if ($LASTEXITCODE -ne 0) { throw 'cargo build failed' }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target\dist\utter.exe dist\utter.exe
          Copy-Item target\dist\utter-console.exe dist\utter.com
          $minutes = [math]::Round(((Get-Date) - $started).TotalMinutes, 1)
          $mb = [math]::Round((Get-Item dist\utter.exe).Length / 1MB, 1)
          "utter.exe (${{ matrix.label }}): $mb MB, built in $minutes min" | Tee-Object -Variable line
          "- $line" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Check utter.exe needs no Visual C++ Redistributable or Vulkan loader, and is a GUI program
        if: matrix.arch == 'x86_64'
        shell: pwsh
        run: |
          $dumpbin = Get-ChildItem "${env:ProgramFiles}\Microsoft Visual Studio" -Recurse -Filter dumpbin.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match 'Hostx64\\x64' } | Select-Object -First 1
          $imports = & $dumpbin.FullName /dependents dist\utter.exe
          $redist = $imports | Select-String -Pattern 'VCRUNTIME|MSVCP|vcomp'
          if ($redist) { throw "utter.exe imports Visual C++ runtime DLLs: $redist" }
          # The Vulkan loader comes with the graphics driver: imported at load
          # time, a missing one would stop Utter before it starts.
          $static = ($imports -join "`n") -split 'delay load dependencies' | Select-Object -First 1
          if ($static -match 'vulkan-1\.dll') { throw "utter.exe imports vulkan-1.dll at load time instead of delay-loading it" }
          $headers = & $dumpbin.FullName /headers dist\utter.exe
          if (-not ($headers | Select-String -SimpleMatch 'subsystem (Windows GUI)')) { throw "utter.exe is not a Windows GUI program" }

      - name: Build the installer
        shell: pwsh
        run: |
          scripts/build-windows-installer.ps1 -Executable dist\utter.exe -Console dist\utter.com -Version ${{ steps.version.outputs.version }} -Arch ${{ matrix.arch }} -OutDir dist
          $mb = [math]::Round((Get-Item dist\UtterSetup-${{ matrix.label }}.exe).Length / 1MB, 1)
          "- UtterSetup-${{ matrix.label }}.exe: $mb MB download" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      # Windows PowerShell 5.1, which the one-line install command runs.
      - name: Check install-windows.ps1 parses
        shell: powershell
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD\packaging\release\install-windows.ps1", [ref]$null, [ref]$errors)
          if ($errors) { $errors | Out-String | Write-Error; exit 1 }

      - name: Install, reinstall, install over another version, and uninstall silently
        shell: pwsh
        run: scripts/test-windows-installer.ps1 -Installer dist\UtterSetup-${{ matrix.label }}.exe -Executable dist\utter.exe -Console dist\utter.com -Version ${{ steps.version.outputs.version }}

      - name: Upload installer logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installer-logs-${{ matrix.label }}
          path: ${{ runner.temp }}/utter-installer-logs
          if-no-files-found: ignore

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: utter-windows-${{ matrix.label }}
          path: |
            dist/UtterSetup-${{ matrix.label }}.exe
            dist/utter.exe
            dist/utter.com
          if-no-files-found: error

  release:
    name: Publish the GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: utter-windows-*
          path: artifacts

      - name: Collect the release files
        run: |
          mkdir -p release
          for label in x64 arm64; do
            dir="artifacts/utter-windows-$label"
            [ -d "$dir" ] || { echo "::warning::No $label build; publishing without it."; continue; }
            cp "$dir/UtterSetup-$label.exe" release/
            (cd "$dir" && zip -q "$GITHUB_WORKSPACE/release/Utter-$label-portable.zip" utter.exe utter.com)
          done
          test -f release/UtterSetup-x64.exe
          cp packaging/release/install-windows.ps1 release/
          (cd release && sha256sum -- * > SHA256SUMS.txt)
          cat release/SHA256SUMS.txt

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          cat > notes.md <<EOF
          **Install:** download **UtterSetup-x64.exe** below and open it (UtterSetup-arm64.exe for ARM PCs such as Snapdragon laptops). No administrator rights needed.

          Windows may say it protected your PC, because the installer isn't code-signed yet: choose **More info**, then **Run anyway**.

          Or install from PowerShell:

          \`\`\`powershell
          powershell -ExecutionPolicy Bypass -Command "iwr https://github.com/$REPO/releases/latest/download/install-windows.ps1 -OutFile install-windows.ps1; ./install-windows.ps1"
          \`\`\`

          The first run downloads a speech model; after that, dictation runs entirely on your PC. Needs 64-bit Windows 10 or 11 (x64 PCs: a 2013 or newer processor with AVX2).
          EOF
          gh release create "$TAG" release/* --repo "$REPO" --title "Utter ${TAG#v} for Windows" --notes-file notes.md

  # Runs the README's one-line install command on a clean Windows machine
  # against the release just published, then uninstalls.
  install-command:
    name: Test the install command
    needs: release
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Install with the one-line command
        shell: cmd
        run: powershell -ExecutionPolicy Bypass -Command "iwr https://github.com/${{ github.repository }}/releases/latest/download/install-windows.ps1 -OutFile install-windows.ps1; ./install-windows.ps1"
      - name: Check the installed version
        shell: pwsh
        run: |
          $expected = '${{ github.ref_name }}'.TrimStart('v')
          $installed = (Get-Content "$env:APPDATA\utter\current-version" -Raw).Trim()
          if ($installed -ne $expected) { throw "Installed $installed, expected $expected." }
          $reported = (& "$env:APPDATA\utter\bin\utter.com" --version) -split '\s+' | Select-Object -Last 1
          if ($reported -ne $expected) { throw "utter --version says $reported, expected $expected." }
          if (-not (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Utter.lnk")) { throw 'No Start menu shortcut.' }
          Write-Output "Utter $installed installed and runs."
      - name: Uninstall
        shell: powershell
        run: |
          ./install-windows.ps1 -Uninstall
          if (Test-Path "$env:APPDATA\utter\versions") { throw 'Uninstall left versions behind.' }
